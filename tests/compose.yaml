# A throwaway WordPress with ACF, the plugin and the fixtures, for `just test`. Same
# WordPress major as yielder.com; free ACF instead of PRO, which behaves the same for the
# field types the plugin touches.
name: yga-wordpress-plugin-test

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    # The entrypoint copies WordPress into the volume and then writes wp-config.php;
    # wp-cli must not start before that.
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/wp-config.php"]
      interval: 1s
      retries: 60
    ports:
      - "127.0.0.1:${WP_PORT:-8089}:80"
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes: &wp-volumes
      - html:/var/www/html
      - ..:/var/www/html/wp-content/plugins/yga-wordpress-plugin:ro
      - ./fixtures:/var/www/html/wp-content/mu-plugins:ro

  cli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    user: "33:33"
    depends_on: [wordpress]
    environment: *wp-env
    volumes: *wp-volumes

volumes:
  html:
